# Fill in the input/output paths, then run: uv run -m synpp config.yml
# Advanced options use defaults declared directly in each pipeline stage.
working_directory: .../cache # Folder used to cache completed pipeline stages.
flowchart_path: .../cache/flowchart.json # Save the pipeline dependency diagram here.
dryrun: false # Set true to inspect the pipeline without running its stages.

run:
    - synthesis.output # Export the synthetic population.
    - matsim.output # Build, simulate, and export the MATSim scenario.

config:
    # Files and folders
    data_path: ... # Folder containing the required input datasets.
    output_path: ... # Folder where generated scenarios are exported.
    analysis_path: ... # Folder where analysis results are saved.
    output_id: output # Name of the exported scenario folder.
    output_prefix: switzerland_ # Prefix used for scenario filenames.

    # Resources and population size
    threads: 48 # Number of CPU threads available to the pipeline.
    java_memory: 210G # Maximum Java memory; adjust to your machine or cluster job.
    random_seed: 518745 # Seed used to reproduce random sampling.
    input_downsampling: 0.001 # Fraction of the population to simulate; 0.001 is 0.1%.
    enable_scaling: false # Scale population totals to a target year.
    scaling_year: 2025 # Target population year when scaling is enabled.
    census: statpop # Population source; statpop uses Swiss population-register data.
    specific_day_scenario: workday # Day to model: workday, weekend, or a weekday name.

    # Network and public-transport inputs
    osm_file: # OSM filenames under data_path/osm; one filename or a list is accepted.
        - bayern-251102.osm.pbf
        - nord-est-251102.osm.pbf
        - switzerland-latest-2025.osm.pbf
        - alsace-251102.osm.pbf
        - nord-ovest-251102.osm.pbf
        - austria-251102.osm.pbf
        - baden-wuerttemberg-251102.osm.pbf
        - franche-comte-251102.osm.pbf
        - rhone-alpes-251102.osm.pbf
        - liechtenstein-251116.osm.pbf
    latest_osm_for_correction: switzerland-261004.osm.pbf # Newer OSM file used to update tags while retaining the old topology.
    gtfs_name: merged_gtfs # Name used to select the GTFS input under data_path/gtfs.
    gtfs_date: dayWithMostServices # Service date, or dayWithMostServices for automatic selection.

    # Scenario scope and calibration
    use_freight: true # Include freight vehicles.
    use_lcv: true # Include light commercial vehicles.
    include_cross_border: false # Generate additional foreign-resident cross-border flows.
    generate_outbound_flows: false # Generate Swiss residents' outbound trips beyond the existing survey trips.
    include_external_population: true # Include the population exported by eqasim-france.
    external_population_folder: ... # Folder containing that eqasim-france population export.
    estimate_dmc: true # Estimate mode-choice parameters; false uses the bundled defaults.
    enable_mode_choice: false # Run population mode choice before preparing MATSim.
    last_iteration: 140 # Final MATSim iteration; smaller values run faster.

    # Optional local inputs
    # cross_border_exclude_shapefiles: [...] # External-population area: extends the network and prevents overlapping survey demand when included.
    # tomtom_api_key: ... # Needed only when enabling new TomTom requests; requests default to zero.
    # eqasim_path: .../switzerland.jar # Use an existing eqasim JAR instead of building it.
    # extent_path: .../region.gpkg # Region boundary for exporting a smaller cut scenario.
    # extent_prefix: geneva_ # Filename prefix for that cut scenario.
