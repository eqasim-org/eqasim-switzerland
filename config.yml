# General pipeline settings
# path to the working directory/cache
working_directory: ...
# path where the pipeline flowchart should be stored
flowchart_path: .../flowchart.json
dryrun: false

# Requested stages
run:
    - synthesis.output
    - matsim.output


# These are configuration options that we use in the pipeline
config:        
    # path to the input data folder
    data_path: ...
    output_path: ...
    analysis_path: ...
    output_id: output
    
    # General parameters
    threads: 48
    random_seed: 518745
    hot_deck_matching_runners: 1
    disable_progress_bar: false
    java_memory: 210G

    # General population
    input_downsampling: 0.001
    enable_scaling: false
    scaling_year: 2025
    use_freight: true
    only_permanent_residents: false
    
    # algorithms selection
    matching_algorithm: v1
    locations_algorithm: rda    
    compute_ovgk_from_gtfs: true

    # census
    census: statpop

    # lcv
    use_lcv: true

    # Cross-border traffic
    include_cross_border: true
    weekend: false # if false, the working days will be selected. 
    
    # PT pricing
    generate_pt_pricing_inputs: false

    # Pt routing parameters
    calibrate_pt_routing_params: false
    
    # there are two options to convert pt schedule: [hafas, gtfs]; default is gtfs
    pt_schedule: gtfs
    hafas_date: 01.10.2018
    gtfs_name: gtfs_fp2024_2024-11-11
    gtfs_date: "dayWithMostServices" 
    
    # if we should use schedule based pt or simulated
    useScheduleBasedTransport: false
    
    # defines the prefix for the cutout scenario name; it should be of the zurich_ format
    extent_prefix: switzerland_

    # specifies if we want to use VDF as the traffic model, default is false
    use_vdf: false

    # Export detailed network in eqasim, default is false
    export_detailed_network: true

    # last iteration when runing MATSim
    last_iteration: 100

    # If you want to simplify the network (merge short links) in eqasim and correct their capacity, default is false
    simplify_network_in_eqasim: true
    correct_links_capacity: true
    remove_nodes_with_no_intersection: true
    
    # path to the osm file, should be placed in data_path/osm (it can be list of files)    
    osm_file: [bayern-251102.osm.pbf, nord-est-251102.osm.pbf, switzerland-latest-2025.osm.pbf,
               alsace-251102.osm.pbf, nord-ovest-251102.osm.pbf, austria-251102.osm.pbf, 
               baden-wuerttemberg-251102.osm.pbf, franche-comte-251102.osm.pbf, rhone-alpes-251102.osm.pbf, 
               liechtenstein-251116.osm.pbf]
    border_offset: 50000 # offset for border extension in meters   

    # wether to parse turn restrictions or not
    parseTurnRestrictions: True

    # whether to add traffic lights to the network, default is false
    add_traffic_lights: true

    # whether to assign elevations to the nodes, default is false
    assign_elevations: true

    # correct the speed
    correct_speed: true
    correct_speed_uphill: true
    speed_factor_outside_border: 0.7
    capacity_factor_outside_border: 0.5
    
    # Specific day scenario (default: workday, also possible: weekend, Monday, ... Sunday)
    specific_day_scenario: workday

    # calibration and dmc model estimation
    estimate_dmc: true
    calibrate_alphas_in_matsim: true
    alphaCalibration.level: canton
    calibrate_betas_in_matsim: false
    activate_traffic_light_delays: true
    activate_unsignalized_intersections_delays: true
    network_calibration.activate: true
    network_calibration.calibrate_disutilities: true
    network_calibration.calibrate_freespeed: true

    # This is for the counts
    simulation_directory: simulation_output
    only_weekday: true
    # tomtom_api_key: ...
    # eqasim_path: ... # you can set the path to jar file
    # num_tomtom_requests: 0 # number of requests to tomtom each time the stage is run
    # num_mapbox_requests: 0
    travel_times_from: tomtom

    # This is to run the cutter
    # extent_path: ...
    # extent_prefix: ...

    # This is for the french part
    cross_border_countries: "All"
    cross_border_exclude_shapefiles: ["/cluster/project/cmdp/ch_data/pipeline/spatial/MMT/MMT_extent_FR.gpkg"]

    # Swiss people crossing the border
    generate_outbound_flows: true # default: false
    outbound_flows_perimeter: ["/cluster/project/cmdp/ch_data/pipeline/spatial/MMT/MMT_extent_FR.gpkg"]
    include_external_population: true # default:false
    external_population_folder: /cluster/project/cmdp/ch_data/pipeline/fr_population_100pct_20260521
    fr_sample_rate: 1.0 # Sample size used for the generation of the outputs in the folder above. Will be used to downsample the FR population if necessary.
    gtfs_name: merged_gtfs 