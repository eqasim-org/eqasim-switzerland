[project]
name = "eqasim-switzerland"
version = "1.4.0"
description = "Generating synthetic populations for Switzerland"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "biogeme>=3.2.11",
    "bhepop2>=2.0.1",
    "catboost>=1.2.8",
    "cma>=4.2.0",
    "contextily>=1.7.0",
    "fiona>=1.9.2",
    "geopandas>=1.1.3",
    "h3>=4.4.2",
    "h5py>=3.15.1",
    "igraph>=1.0.0",
    "ipfn>=1.4.4",
    "lxml>=5.3.2",
    "matplotlib>=3.10.8",
    "mobisurvstd>=1.1.0",
    "mock>=5.2.0",
    "numba>=0.65.0",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "osmnx>=1.4.0",
    "osmium>=4.3.1",
    "pandana>=0.7",
    "palettable>=3.3.3",
    "pandas>=3.0.2",
    "polars>=1.39.3",
    "py7zr>=1.1.3",
    "pydeck>=0.9.1",
    "pyogrio>=0.12.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.3",
    "python-calamine>=0.6.2",
    "rasterstats>=0.19.0",
    "rtree>=1.2.0",
    "scikit-learn>=1.8.0",
    "scikit-survival>=0.21.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "statsmodels>=0.14.6",
    "synpp>=1.6.2",
    "tables>=3.7.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "xgboost>=3.1.2",
    "xopen>=2.0.2",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
    "zstandard>=0.25.0",
    "folium"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true