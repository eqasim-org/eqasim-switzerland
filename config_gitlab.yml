# General pipeline settings
working_directory: cache
dryrun: false

# Requested stages
run:
    - matsim.simulation.run

# These are configuration options that we use in the pipeline
config:
    threads: 24
    random_seed: 0
    hot_deck_matching_runners: 24
    disable_progress_bar: true
    java_memory: 100G
    input_downsampling: 0.001
    enable_scaling: true
    scaling_year: 2045
    use_freight: true
    hafas_date: 01.10.2018
    data_path: /cluster/home/anding/ch/data/ch_raw_data/switzerland_data
    output_path: cache/scenarios/
    output_id: test